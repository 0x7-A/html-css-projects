<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../style.css" >
    <title>Acme Plan Contact</title>
</head>
<body>
     <header><h1>Acme Support</h1></header>
 <nav>
    <a  href="../index.html">Home</a>
    <a>About</a>
    <a>Contact</a>
 </nav>
 <main>
     <hr>
<h2>Contact us</h2>
<p>Send us a message and we will get back to you.</p>
<form  class = "ContactForm" action="Destination.html" method ="post" >
    <div class="form-row">
<label for = "FullName">FullName</label>
<input type="text" id = "fullname" name = "fullname"  required>
</div>
    <div class="form-row">
<label for="email">Email</label>
<input type="email" id = "email" name ="email" required placeholder="Enter a valid email" > 
</div>
    <div class="form-row">
<label for="Subject">Subject</label>
<select id="Subject" name="Subject">
  <option value="subscribe">subscribe</option>
  <option value="suggestion">suggestion</option>
  <option value="info">more info</option>
</select>
    </div>
        <div class="form-row">
<label for="message">message</label>
<textarea id="message" name="message" rows="5"></textarea>
</div>
<div class="radio-group">
      <p class="group-title">How did you hear about us?</p>
      <div class="radio-options">
        <label class="radio-item">
          <input type="radio" id="Search" name="hearaboutus" value="search" checked>
          <span>Search</span>
        </label>
        <label class="radio-item">
          <input type="radio" id="Friend" name="hearaboutus" value="Friend">
          <span>Friend</span>
        </label>
        <label class="radio-item">
          <input type="radio" id="Social media" name="hearaboutus" value="Social media">
          <span>Social media</span>
        </label>
      </div>
    </div> <!-- Ensure this closing div is present -->
    <div class="checkbox-row">
      <input type="checkbox" id="subscribe" name="subscribe" checked>
      <label for="subscribe">Send me product updates</label>
    </div>
    <button type="submit">Send</button>
  </form>
 </main>
<hr>

        <small>&copy; 2025 Amjad</small>
    </footer>
</body>
</html>
